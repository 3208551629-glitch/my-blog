<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="50%" style="stop-color:#764ba2"/>
      <stop offset="100%" style="stop-color:#f093fb"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1100" cy="530" r="200" fill="rgba(255,255,255,0.08)"/>
  <circle cx="600" cy="315" r="300" fill="rgba(255,255,255,0.05)"/>

  <!-- Decorative lines -->
  <line x1="0" y1="200" x2="400" y2="0" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <line x1="800" y1="630" x2="1200" y2="430" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Blog icon -->
  <g transform="translate(540, 180)">
    <rect x="0" y="0" width="120" height="150" rx="10" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <line x1="20" y1="30" x2="100" y2="30" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="55" x2="100" y2="55" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="80" x2="80" y2="80" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="105" x2="90" y2="105" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="130" x2="60" y2="130" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="600" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#text)">
    我的博客
  </text>

  <!-- Subtitle -->
  <text x="600" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.9)">
    记录学习与成长 · 技术 · 生活 · 思考
  </text>

  <!-- Bottom decoration -->
  <rect x="450" y="520" width="300" height="3" rx="1.5" fill="rgba(255,255,255,0.5)"/>
</svg>